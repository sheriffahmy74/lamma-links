<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F8F0E6" />

    <title>__TITLE__</title>
    <meta name="description" content="__DESCRIPTION__" />

    <link rel="canonical" href="__SITE_URL__" />
    <link rel="icon" href="__LOGO__" type="__LOGO_MIME__" />
    <link rel="apple-touch-icon" href="__LOGO__" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="لمّة" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:title" content="__TITLE__" />
    <meta property="og:description" content="__DESCRIPTION__" />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:image" content="__SITE_URL__/__LOGO__" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__TITLE__" />
    <meta name="twitter:description" content="__DESCRIPTION__" />
    <meta name="twitter:image" content="__SITE_URL__/__LOGO__" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>

  <body>
    <div class="aurora" aria-hidden="true">
      <span class="aurora__blob aurora__blob--a"></span>
      <span class="aurora__blob aurora__blob--b"></span>
      <span class="aurora__blob aurora__blob--c"></span>
    </div>

    <a class="skip-link" href="#links">تخطَّ إلى الروابط</a>

    <main class="shell">
      <header class="hero">
        <div class="hero__logo-frame">
          <img
            class="hero__logo"
            src="__LOGO__"
            alt="شعار لمّة"
            width="160"
            height="160"
            decoding="async"
          />
        </div>

        <h1 class="hero__name">__BRAND_NAME__</h1>
        <p class="hero__tagline">__TAGLINE__</p>
        <span class="hero__rule" aria-hidden="true"></span>
      </header>

      <nav id="links" class="links" aria-label="روابط لمّة على وسائل التواصل">
        __LINKS__
      </nav>

      <footer class="footer">
        <p class="footer__text">© <span id="year">2026</span> لمّة — كل الحقوق محفوظة</p>
      </footer>
    </main>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
    <script type="module" src="scripts/app.js"></script>
  </body>
</html>
